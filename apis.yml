name: Lumius
description: >-
  Lumius is a Y Combinator (Spring 2026) medical-imaging startup building fast,
  smart, accessible real-time 3D ultrasound systems — described as "a 3D camera
  for the body." The technology aims to move ultrasound beyond traditional 2D
  imaging to intelligent, AI-assisted 3D visualization across larger volumes,
  with an initial focus on vascular access and central-line placement (where
  roughly half of first attempts fail among new clinicians) and future targets
  including blood-clot detection, tumor diagnosis, and biopsy guidance. The
  company partners with academic institutions such as Duke University and
  Columbia University. Lumius is a hardware/device company with no public API,
  SDK, or developer platform; its products are pre-market and not intended for
  medical use. This profile was added to the API Evangelist network as a VC
  portfolio lead and has been reviewed by the enrichment pipeline.
